[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic-agent"
version = "0.1.0"
description = "Local-to-Cloud Diagnostic Gateway: Windows-first diagnostic agent with an optional AWS serverless backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Airton" }]
keywords = ["diagnostics", "monitoring", "windows", "telemetry", "serverless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
]
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "moto[dynamodb,ssm]==5.2.3",
    "boto3==1.43.106",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "cfn-lint==1.57.1",
]

[project.scripts]
diagnostic-agent = "agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# UP042 would rewrite the `str, Enum` members to `enum.StrEnum`. The design
# (B.3) deliberately uses `str`-valued `enum.Enum` subclasses for direct JSON
# serialization and stable member values, so this rewrite is declined.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# S101 asserts, S105/S106 "hardcoded password" (test sentinels), S311 seeded RNG.
"tests/**" = ["S101", "S105", "S106", "S311"]
# S105: the CheckStatus.PASS member value is a status literal, not a secret.
"src/shared/models/diagnostic.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["psutil", "psutil.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["windows: tests that require real Windows hardware/tools"]
